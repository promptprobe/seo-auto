name: Behavior fixture
description: Report a reproducible input and expected output without requiring production access.
title: "fixture: "
labels: ["fixture"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - pipeline
        - content audit
        - technical SEO
        - search metrics
        - adapter
        - unknown
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the source and observation date when the behavior depends on an external platform.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      render: json
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data check
      options:
        - label: This report contains no credentials, private URLs, production data, or proprietary source material.
          required: true
